    <div id="app"><!--[--><div class="g"><header class="i"><h3 class="j"><a href="/" title="Home">HeZulong</a></h3><span>:</span><ul class="l"><!--[--><li><a class="e" href="/bookmark" tabindex="0"><!--[-->Bookmark<!--]--></a></li><li><a class="e" href="/gist" tabindex="0"><!--[-->Gist<!--]--></a></li><!--]--></ul></header><main><article class="s"><h1>江城子</h1><span class="t"><span>苏轼</span><span>宋</span></span><nav aria-labelledby="post-outline-aria-label" class="x u"><div id="post-outline-aria-label" aria-level="2" class="y" role="heading"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewbox="0 0 512 512"><path fill="currentColor" d="M0 96C0 78.33 14.33 64 32 64H416C433.7 64 448 78.33 448 96C448 113.7 433.7 128 416 128H32C14.33 128 0 113.7 0 96zM64 256C64 238.3 78.33 224 96 224H480C497.7 224 512 238.3 512 256C512 273.7 497.7 288 480 288H96C78.33 288 64 273.7 64 256zM416 448H32C14.33 448 0 433.7 0 416C0 398.3 14.33 384 32 384H416C433.7 384 448 398.3 448 416C448 433.7 433.7 448 416 448z"></path></svg><span>ON THIS PAGE</span></div><div class="z"><div class="aa"></div><ul class="ac root"><!--[--><!--]--></ul></div></nav><div style="position:relative;" id="post-content"><div data-v-e258e00f><button class="a d" type="button" id="toggle" data-v-e258e00f><!--[--><svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 32 32" data-v-e258e00f><path fill="currentColor" d="M9 14a5 5 0 1 1 5-5a5.006 5.006 0 0 1-5 5m0-8a3 3 0 1 0 3 3a3.003 3.003 0 0 0-3-3M4 26.586L26.585 4L28 5.415L5.414 28zM23 28a5 5 0 1 1 5-5a5.006 5.006 0 0 1-5 5m0-8a3 3 0 1 0 3 3a3.003 3.003 0 0 0-3-3" style="" data-v-e258e00f></path><path fill="currentColor" d="M9 14a5 5 0 1 1 5-5a5.006 5.006 0 0 1-5 5M4 26.586L26.585 4L28 5.415L5.414 28zM23 28a5 5 0 1 1 5-5a5.006 5.006 0 0 1-5 5" style="display:none;" data-v-e258e00f></path></svg><!--]--></button><div id="poem" class="poem-grid" data-v-e258e00f><p class="start" data-title="江城子·密州出猎" data-v-e258e00f><span data-punctuation="，" data-v-e258e00f>老夫聊发少年狂</span><span data-punctuation="，" data-v-e258e00f>左牵黄</span><span data-punctuation="，" data-v-e258e00f>右擎苍</span><span data-punctuation="，" data-v-e258e00f>锦帽貂裘</span><span data-punctuation="。" data-v-e258e00f>千骑卷平冈</span><span data-punctuation="，" data-v-e258e00f>为报倾城随太守</span><span data-punctuation="，" data-v-e258e00f>亲射虎</span><span data-punctuation="。" data-v-e258e00f>看孙郎</span><br data-v-e258e00f><span data-punctuation="。" data-v-e258e00f>酒酣胸胆尚开张</span><span data-punctuation="，" data-v-e258e00f>鬓微霜</span><span data-punctuation="！" data-v-e258e00f>又何妨</span><span data-punctuation="，" data-v-e258e00f>持节云中</span><span data-punctuation="？" data-v-e258e00f>何日遣冯唐</span><span data-punctuation="，" data-v-e258e00f>会挽雕弓如满月</span><span data-punctuation="，" data-v-e258e00f>西北望</span><span data-punctuation="。" data-v-e258e00f>射天狼</span></p><p class="end" data-title="江城子·乙卯正月二十日夜记梦" data-v-e258e00f><span data-punctuation="，" data-v-e258e00f>十年生死两茫茫</span><span data-punctuation="，" data-v-e258e00f>不思量</span><span data-punctuation="。" data-v-e258e00f>自难忘</span><span data-punctuation="，" data-v-e258e00f>千里孤坟</span><span data-punctuation="。" data-v-e258e00f>无处话凄凉</span><span data-punctuation="，" data-v-e258e00f>纵使相逢应不识</span><span data-punctuation="，" data-v-e258e00f>尘满面</span><span data-punctuation="。" data-v-e258e00f>鬓如霜</span><br data-v-e258e00f><span data-punctuation="，" data-v-e258e00f>夜来幽梦忽还乡</span><span data-punctuation="，" data-v-e258e00f>小轩窗</span><span data-punctuation="。" data-v-e258e00f>正梳妆</span><span data-punctuation="，" data-v-e258e00f>相顾无言</span><span data-punctuation="。" data-v-e258e00f>惟有泪千行</span><span data-punctuation="，" data-v-e258e00f>料得年年肠断处</span><span data-punctuation="，" data-v-e258e00f>明月夜</span><span data-punctuation="。" data-v-e258e00f>短松冈</span></p></div></div></div></article></main><footer class="p"><small><time datetime="2026-11-16T22:20:02+08:00">2026</time> © HeZulong. </small><div class="q"><a href="https://gith
